<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Diagram of two MRI modalities fused into one white matter lesion segmentation">
  <!-- T1 slice -->
  <ellipse cx="100" cy="150" rx="72" ry="60" fill="none" stroke="#5f6b7a" stroke-width="3"/>
  <text x="100" y="230" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" fill="#5f6b7a">T1</text>

  <!-- FLAIR slice -->
  <ellipse cx="100" cy="150" rx="72" ry="60" fill="none" stroke="#0f6b5b" stroke-width="3" stroke-dasharray="1 7" transform="translate(16 0)"/>
  <ellipse cx="300" cy="150" rx="72" ry="60" fill="none" stroke="#5f6b7a" stroke-width="3"/>
  <text x="300" y="230" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" fill="#5f6b7a">FLAIR</text>
  <ellipse cx="292" cy="132" rx="16" ry="11" fill="#e8734a" opacity="0.85"/>
  <ellipse cx="316" cy="168" rx="10" ry="8" fill="#f0a35f" opacity="0.85"/>

  <!-- fusion arrow -->
  <path d="M182 150 H 218" stroke="#c8a659" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#c8a659"/>
    </marker>
  </defs>
  <circle cx="200" cy="150" r="16" fill="#ffe8b3" stroke="#c8a659" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#6f4a00">+</text>
</svg>
